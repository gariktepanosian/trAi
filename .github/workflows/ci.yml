name: TrAI CI/CD Pipeline (Google Cloud)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Required GitHub Secrets:
#   GCP_SA_KEY          — Google Cloud Service Account JSON key (base64 encoded)
#   GCP_PROJECT_ID      — Google Cloud project ID
#   GCP_REGION          — e.g. us-central1
#   GCP_ARTIFACT_REGISTRY — e.g. us-central1-docker.pkg.dev
#   GCP_CLOUD_RUN_SERVICE — e.g. trai-backend

jobs:

  # ─── Job 1: Backend Build + Test ────────────────────────────────────────────
  backend-build-and-test:
    name: Backend Build & Test (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x backend/gradlew

      - name: Run Backend Unit Tests & Build JAR
        working-directory: backend
        run: ./gradlew clean check bootJar --no-daemon

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar

  # ─── Job 2: Frontend Validation ─────────────────────────────────────────────
  frontend-validation:
    name: Frontend Lint & Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Frontend Static Assets
        run: |
          test -f frontend/index.html
          test -f frontend/style.css
          test -f frontend/app.js
          echo "Frontend static files verified successfully."

      - name: Build Frontend Docker Image
        run: docker build -t trai-frontend:ci frontend/

  # ─── Job 3: Docker Compose Validation ───────────────────────────────────────
  docker-compose-validate:
    name: Docker Compose Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config -q

  # ─── Job 4: Flutter Mobile Build Check ──────────────────────────────────────
  flutter-build-check:
    name: Flutter Mobile Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

  # ─── Job 5: Deploy to Google Cloud Run (main branch only) ───────────────────
  deploy-to-google-cloud:
    name: Deploy Backend to Google Cloud Run
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, docker-compose-validate]
    # Only deploy on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_ARTIFACT_REGISTRY }} --quiet

      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/trai/trai-backend:${{ github.sha }} \
                       -t ${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/trai/trai-backend:latest \
                       ./backend

      - name: Push Image to Google Artifact Registry
        run: |
          docker push ${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/trai/trai-backend:${{ github.sha }}
          docker push ${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/trai/trai-backend:latest

      - name: Deploy to Google Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCP_CLOUD_RUN_SERVICE }} \
            --image ${{ secrets.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/trai/trai-backend:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 2 \
            --concurrency 80 \
            --min-instances 0 \
            --max-instances 10 \
            --port 8080 \
            --set-env-vars SPRING_PROFILES_ACTIVE=prod \
            --update-secrets \
              MONGODB_URI=trai-mongodb-uri:latest,\
              REDIS_HOST=trai-redis-host:latest,\
              XAI_API_KEY=trai-xai-api-key:latest,\
              OPENAI_API_KEY=trai-openai-api-key:latest,\
              TWITTER_BEARER_TOKEN=trai-twitter-bearer-token:latest,\
              GEMINI_PROJECT_ID=trai-gemini-project-id:latest,\
              JWT_SECRET=trai-jwt-secret:latest,\
              FCM_SERVER_KEY=trai-fcm-server-key:latest \
            --quiet

      - name: Deploy API Gateway Config
        run: |
          # Replace placeholder with actual Cloud Run URL
          BACKEND_URL=$(gcloud run services describe ${{ secrets.GCP_CLOUD_RUN_SERVICE }} \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)')
          sed -i "s|\${BACKEND_SERVICE_URL}|${BACKEND_URL}|g" google-api-gateway.yaml
          
          # Create or update API Gateway (if it exists, update; otherwise create)
          gcloud api-gateway api-configs create trai-gateway-config-${{ github.run_number }} \
            --api=trai-gateway \
            --openapi-spec=google-api-gateway.yaml \
            --project=${{ secrets.GCP_PROJECT_ID }} || true

      - name: Output Deployment URL
        run: |
          echo "Deployment complete!"
          gcloud run services describe ${{ secrets.GCP_CLOUD_RUN_SERVICE }} \
            --region ${{ secrets.GCP_REGION }} \
            --format 'value(status.url)'
