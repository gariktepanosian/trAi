version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: trai-mongo
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: trai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
