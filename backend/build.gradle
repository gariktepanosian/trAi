plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.trai'
version = '0.0.1-SNAPSHOT'
description = 'TrAI Platform Backend — Trust-as-a-Service Engine'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ─── Spring Boot Core ──────────────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// ─── Persistence ───────────────────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// ─── Caching ───────────────────────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	// ─── Security + JWT ────────────────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// ─── Validation ────────────────────────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// ─── Rate Limiting (Bucket4j + Redis) ──────────────────────────────────────
	implementation 'com.bucket4j:bucket4j-core:8.10.1'
	implementation 'com.bucket4j:bucket4j-redis:8.10.1'

	// ─── AI / LangChain4j ──────────────────────────────────────────────────────
	implementation 'dev.langchain4j:langchain4j-spring-boot-starter:0.29.1'
	implementation 'dev.langchain4j:langchain4j-vertex-ai-gemini:0.29.1'
	implementation 'dev.langchain4j:langchain4j-open-ai:0.29.1'

	// ─── Google Cloud Storage (replaces Yandex Object Storage) ────────────────
	implementation 'com.google.cloud:google-cloud-storage:2.40.1'

	// ─── Firebase Admin SDK (FCM push notifications) ───────────────────────────
	implementation 'com.google.firebase:firebase-admin:9.3.0'

	// ─── Twitter API v2 (real-time tweet scraping) ─────────────────────────────
	// Uses plain OkHttp + Jackson — no heavyweight SDK needed
	implementation 'com.squareup.okhttp3:okhttp:4.12.0'

	// ─── Web Scraping ──────────────────────────────────────────────────────────
	implementation 'org.jsoup:jsoup:1.17.2'

	// ─── Async / Concurrency utilities ─────────────────────────────────────────
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// ─── Test ──────────────────────────────────────────────────────────────────
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo.spring3x:4.13.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
