spring:
  application:
    name: TrAIEngine

  # ─── MongoDB (MongoDB Atlas or self-hosted on Cloud Run) ───────────────────
  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  # ─── Cache ──────────────────────────────────────────────────────────────────
  cache:
    type: redis
    redis:
      time-to-live: 600000   # 10 minutes in milliseconds

# ─── Google Vertex AI — Gemini 2.0 Flash ─────────────────────────────────────
langchain4j:
  vertex-ai:
    gemini:
      project: ${GEMINI_PROJECT_ID}
      location: ${GEMINI_LOCATION:us-central1}
      model-name: gemini-2.0-flash-exp

# ─── xAI Grok-2 (pinned version) ─────────────────────────────────────────────
xai:
  api-key: ${XAI_API_KEY}
  model: grok-2-1212

# ─── OpenAI ChatGPT-4o ────────────────────────────────────────────────────────
openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o

# ─── Twitter/X API v2 ────────────────────────────────────────────────────────
twitter:
  bearer-token: ${TWITTER_BEARER_TOKEN}

# ─── Google Cloud Storage ─────────────────────────────────────────────────────
gcs:
  bucket-name: ${GCS_BUCKET_NAME:trai-media}
  project-id: ${GCP_PROJECT_ID}

# ─── Firebase Push Notifications ─────────────────────────────────────────────
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  server-key: ${FCM_SERVER_KEY:}

# ─── JWT ─────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# ─── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never

# ─── Actuator ────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.trai: INFO
